name: Build LaTeX (PDF)

on:
  push:
    branches: [ main, master ]   # change to your default branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: dokument.tex       # <-- change to your root .tex filename

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: dokument.pdf            # the compiled PDF appears next to the source file
